version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: music_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: music_website
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: spring_app
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/music_website
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      FRONTEND_URL: http://localhost
      FRONTEND_ID_KEY: 4PvBlqCTz5
      STATIC_FILE_URL: /app/resources
      JWT_SECRET_KEY: E64BDA47BF189B1F98B9AFA86B7FF876AA3SD87NJ1NU781J71JAB975K8
      JWT_EXPIRATION_TIME: 1296000000
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: mydifferentapp@gmail.com
      SPRING_MAIL_PASSWORD: bkxo rsxc voyw feyc
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: true
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: true
    depends_on:
      - db

volumes:
  db_data:
